title: One-Line
tooltip: >
  Draws the gas piping one-line diagram per firm standard on a new Revit
  drafting view. Run Size Gas first: the diagram is drawn only for a
  complete system whose pipes are at the Size Gas sizes, otherwise the
  console lists why. Select the gas meter, or on an existing building the
  first new gas pipe at the connection to existing. Pick the table and heat
  content Size Gas ran on.
