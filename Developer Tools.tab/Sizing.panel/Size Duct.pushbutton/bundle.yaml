title: Size Duct
tooltip: >
  Pick the unit (RTU, AHU, fan) or a supply or return duct, then every MAIN
  duct is sized to the RJA velocity and friction limits and WRITTEN into the
  model: smallest even size, 6 in minimum, round up to 60 in, rectangular
  mains keep their drawn height and are sized on width (4:1 maximum).
  The elbows, dampers and endcaps between two mains are matched to the new
  size. Takeoff boots, branches and diffusers are never touched (the
  auto-sizing diffusers set the branch). Existing phase ductwork is left
  alone. Every joint is audited afterwards; run Duct Performance to check.
