title: Size Water
tooltip: >
  Select the RPZ / backflow preventer, then click to size the domestic water
  piping per the 2024 IPC and WRITE the sizes into the model.
  Sizes BOTH domestic cold water (on TOTAL fixture units) and domestic hot
  water (on HOT fixture units), overwrites the drawn sizes, and resizes the
  fittings to match.
  Every run also puts the WSFU take-off on a drafting view and a sheet, so the
  fixture unit count behind the sizes can be checked against the model.
  The only system it does not size is the hot water RETURN, because return
  piping is sized on circulation flow rather than on fixture units.
